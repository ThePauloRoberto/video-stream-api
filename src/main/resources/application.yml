spring:
  application:
    name: video-stream-api
  threads:
    virtual:
      enabled: true # request threads viram virtuais: bloquear em I/O deixa de custar thread de plataforma
  mvc:
    async:
      request-timeout: 10m # tempo máximo de uma resposta em streaming
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:500MB}
      max-request-size: ${MAX_UPLOAD_SIZE:500MB}
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  compression:
    # NUNCA comprimir vídeo: gzip quebra Content-Length/Content-Range e adiciona CPU sem ganho
    enabled: false

video:
  storage:
    bucket: ${S3_BUCKET:videos}
    region: ${AWS_REGION:us-east-1}
    key-prefix: ${S3_KEY_PREFIX:videos/}
    endpoint-override: ${S3_ENDPOINT:http://localhost:4566}
    path-style-access: ${S3_PATH_STYLE:true}
    chunked-encoding-enabled: ${S3_CHUNKED_ENCODING:false}
    access-key-id: ${AWS_ACCESS_KEY_ID:test}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:test}
  streaming:
    chunk-size: ${STREAM_CHUNK_SIZE:1MB}
    max-range-size: ${STREAM_MAX_RANGE_SIZE:1MB}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true

logging:
  level:
    com.videostream: ${LOG_LEVEL:INFO}
    software.amazon.awssdk: WARN
  pattern:
    level: "%5p [%X{correlationId:-}]"
