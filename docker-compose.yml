services:
  localstack:
    image: localstack/localstack:4.4
    container_name: video-stream-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - AWS_DEFAULT_REGION=us-east-1
      - DEBUG=0
    volumes:
      - "./docker/localstack/init:/etc/localstack/init/ready.d:ro"
      - "localstack-data:/var/lib/localstack"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  localstack-data:
